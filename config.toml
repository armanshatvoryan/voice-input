# voice-input configuration.
# Copy to ~/.config/voice-input/config.toml to override without touching the repo.

# ggml-large-v3-turbo = fast + multilingual. Swap to ggml-large-v3.bin for max accuracy
# (~2x slower), or a small/base model if you want sub-300ms turnaround in English.
model = "~/.cache/whisper-cpp/ggml-large-v3-turbo.bin"
language = "auto"          # "auto" | "en" | "ru" | "hy" | ...

[server]
host = "127.0.0.1"
port = 8178
spawn = true               # false = expect an already-running whisper-server
threads = 4

[audio]
# device = 1               # index from `voice-input --list-devices`; omit for system default
samplerate = 16000
min_ms = 300               # anything shorter is treated as an accidental tap
max_s = 180
# Encoder context. 0 = full 30s window: always correct, ~2.2s per utterance.
# 512 is ~1.5x faster for clips under ~5s, but reduced contexts are an experimental
# whisper.cpp knob that fails *silently* (see README) — only 512/768/1024/1280 were
# measured safe here, and anything longer than the value covers is auto-promoted to
# full. Leave at 0 unless you dictate only short bursts and have verified the result.
context = 0
# Mic is opened only while the key is held (on-demand) — off when idle, no preroll.

[hotkey]
# Hold right-option (⌥ right) to dictate; right-option + shift = transcribe then
# tidy via `claude -p`. `alt_r` is side-specific — the left option stays free for
# typing special characters. Back to a chord: modifiers = ["ctrl","alt"], key = "space".
modifiers = []
key = "alt_r"
cleanup_modifier = "shift"
cancel_key = "backspace"   # pressed mid-hold: abort the take, paste nothing (esc collides with Force Quit)

[preview]
# Live transcript in a floating HUD while you hold the key. A fast model on its own
# whisper-server drives the partials; the large model still does the accurate final
# paste on release. Set enabled = false to dictate with no live preview (one server).
enabled = true
# small = readable live partials + correct language auto-detect (~0.5-1s per decode).
# ggml-base is ~2x faster but garbles words, so it is not the default. The large model
# still does the accurate final paste on release regardless of this.
model = "~/.cache/whisper-cpp/ggml-small.bin"
port = 8179
interval_ms = 400          # target refresh; loop stretches if a decode takes longer
threads = 4

[inject]
restore_clipboard = true
paste_delay_ms = 120
restore_delay_ms = 500

[sound]
enabled = true
